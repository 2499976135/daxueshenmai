name: Build Android APK

# 触发方式：在 GitHub 网页手动点击运行，或推送到 main 分支时自动运行
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    # 只改文档 / 忽略规则时不必重新打包
    paths-ignore:
      - 'README.md'
      - 'DEVELOPMENT.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Normalize line endings
        run: |
          cd android
          # Windows 上传的 gradlew 可能带 CRLF，Linux 上会报 exit 127
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，无法签名发布"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shiguang-release.jks"
          ls -l "$RUNNER_TEMP/shiguang-release.jks"

      - name: Build release APKs (per-ABI)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/shiguang-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
